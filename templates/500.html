<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>500 - Server Error | Coupon Management</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1">
<link rel="stylesheet" href="/static/css/style.css?v=35">
<style>
.error-page-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
.error-card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    padding: 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
}
.error-icon {
    font-size: 52px;
    margin-bottom: 16px;
}
.error-code {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ef4444;
    text-transform: uppercase;
    margin-bottom: 8px;
}
.error-card h1 {
    font-size: 24px;
    color: #0f172a;
    margin-bottom: 12px;
    font-weight: 700;
}
.error-card p {
    font-size: 14px;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 24px;
}
.error-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
}
.error-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
    transition: all 0.2s ease;
}
.error-btn.primary {
    background: #2563eb;
    color: #ffffff;
}
.error-btn.primary:hover {
    background: #1d4ed8;
}
.error-btn.secondary {
    background: #f1f5f9;
    color: #334155;
}
.error-btn.secondary:hover {
    background: #e2e8f0;
}
</style>
</head>
<body class="error-page-wrapper">
    <div class="error-card">
        <div class="error-icon">✈</div>
        <div class="error-code">Server Error 500</div>
        <h1>Something went wrong</h1>
        <p>The server encountered a temporary issue while processing your request. Please try refreshing the page or return to the login portal.</p>
        <div class="error-actions">
            <a href="/login/" class="error-btn primary">Go to Login</a>
            <a href="javascript:location.reload();" class="error-btn secondary">Retry</a>
        </div>
    </div>
</body>
</html>
