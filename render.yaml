services:
  - type: web
    name: coupon-management
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn coupon_system.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: DEBUG
        value: "False"
      - key: MYSQL_DATABASE
        value: coupon_management
      - key: MYSQL_USER
        value: 46kkFoCWPfKm8RH.root
      - key: MYSQL_PASSWORD
        value: F2I9tzFlrCX8WHGP
      - key: MYSQL_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_SSL_MODE
        value: REQUIRED
      - key: SECRET_KEY
        generateValue: true
